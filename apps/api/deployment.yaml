apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: myapp

spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: nefor/api:test

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        envFrom:
          - configMapRef:
              name: api-config

        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limit:
            cpu: 500m
            memory: 300mi
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20